name: Verify WOWII 59 counterexample

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: wow59-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Kernel-check certificate
        id: verify
        shell: bash
        run: |
          set +e
          status=0
          {
            echo '$ lake build WOW59.Counterexample'
            lake build WOW59.Counterexample || status=1
            echo '$ lake env lean -DwarningAsError=true WOW59Check.lean'
            lake env lean -DwarningAsError=true WOW59Check.lean || status=1
            echo '$ source hygiene'
            if grep -RInE '\b(sorry|admit|axiom|unsafe|native_decide)\b|decide[[:space:]]*\+native|Lean\.ofReduceBool|Lean\.trustCompiler' WOW59/Counterexample.lean; then
              echo 'Forbidden source construct found.'
              status=1
            fi
          } > lean-ci.log 2>&1
          if grep -Eq 'Lean\.ofReduceBool|Lean\.trustCompiler|sorryAx' lean-ci.log; then
            echo 'Forbidden axiom dependency found in theorem audit.' >> lean-ci.log
            status=1
          fi
          printf '\nEXIT_STATUS=%s\n' "$status" >> lean-ci.log
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Print compiler log
        if: always()
        run: cat lean-ci.log

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wow59-lean-ci-log-${{ github.run_id }}
          path: lean-ci.log

      - name: Fail job when Lean failed
        if: steps.verify.outputs.exit_status != '0'
        run: exit 1
